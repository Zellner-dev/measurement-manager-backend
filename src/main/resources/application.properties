spring.application.name=workout-manager

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Local development: in-memory H2 (Postgres compatibility mode)
spring.datasource.url=jdbc:h2:mem:workoutmanager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
