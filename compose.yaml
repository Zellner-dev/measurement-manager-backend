# Local PostgreSQL for testing the prod profile:
#   docker compose up -d
#   DB_URL=jdbc:postgresql://localhost:5432/workoutmanager DB_USERNAME=workout DB_PASSWORD=workout \
#   CORS_ALLOWED_ORIGINS=http://localhost:5173 SPRING_PROFILES_ACTIVE=prod ./mvnw spring-boot:run
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: workoutmanager
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
